node_id: veritas-pi-01
mesh_port: 48750
bind: 0.0.0.0
web_port: 8787

array:
  name: veritas-ula-4
  frequency_hz: 144390000
  d_m: 1.04
  elements:
    - {id: 0, x: 0.00, y: 0.0, z: 0.0, coil: A}
    - {id: 1, x: 1.04, y: 0.0, z: 0.0, coil: B}
    - {id: 2, x: 2.08, y: 0.0, z: 0.0, coil: C}
    - {id: 3, x: 3.12, y: 0.0, z: 0.0, coil: D}

fpga:
  transport: spi
  spi_device: /dev/spidev0.0
  spi_speed_hz: 8000000
  sample_clock_hz: 50000000
  channels: 4

hal:
  varactor_bus: spi
  relay_gpio: [17, 27, 22, 23]
  lc_bands:
    - {name: lf, hz_min: 1000, hz_max: 100000, relay: 0}
    - {name: hf, hz_min: 1800000, hz_max: 30000000, relay: 1}
    - {name: vhf, hz_min: 144000000, hz_max: 148000000, relay: 2}

feedback:
  period_ms: 50
  phase_gain: 0.35
  max_step_deg: 8.0
